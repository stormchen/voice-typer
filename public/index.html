<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoiceTyper</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎤 VoiceTyper</h1>
      <p id="hotkey-hint">快捷鍵: Ctrl+Shift+V（按一次開始，再按一次結束）</p>
    </div>

    <div class="status-area">
      <div id="status" class="status idle">
        <span class="indicator"></span>
        <span id="status-text">待機中</span>
      </div>
    </div>

    <div class="result-area">
      <div id="result-text" class="result-text">辨識結果將顯示在這裡</div>
    </div>

    <div class="history-header">
      <span>歷史記錄（點擊複製）</span>
      <button id="clear-history-btn" class="btn-link">清除</button>
    </div>
    <div id="history-list" class="history-list">
      <div class="history-empty">尚無記錄</div>
    </div>

    <button id="settings-btn" class="btn-settings">⚙️ 設定</button>
  </div>

  <script src="recorder.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
